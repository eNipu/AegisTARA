[package]
name = "aegis-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "AegisTARA domain model: arena-based attack trees with typed IDs."
license = "LicenseRef-Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
dhat = "0.3.3"
divan = "0.1.21"
proptest = "1"

[[bench]]
name = "parents_time"
harness = false

[[bench]]
name = "parents_memory"
harness = false

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "store_memory"
harness = false

[[bench]]
name = "pack"
harness = false
