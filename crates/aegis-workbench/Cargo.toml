[package]
name = "aegis-workbench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "AegisTARA workbench: the GPUI window over the client core."
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aegis-workbench"
path = "src/main.rs"

[dependencies]
aegis-client.workspace = true
aegis-model.workspace = true
aegis-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# GPUI runs on macOS and Windows only (job 182, ADR 0066).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
