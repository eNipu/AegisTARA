[package]
name = "aegis-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "AegisTARA server: gRPC API over the aegis-model engine, edit leases, live observers."
license.workspace = true

[features]
# Lets `AEGIS_DEV_LICENSE=1` start the server without a license file. Never
# enable it in a shipped binary (docs/release-checklist.md).
dev-license = []

[dependencies]
aegis-auth.workspace = true
aegis-license.workspace = true
aegis-model.workspace = true
aegis-proto.workspace = true
argon2.workspace = true
base64.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
http.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
aegis-auth = { workspace = true, features = ["test-support"] }
aegis-license = { workspace = true, features = ["issuer"] }
tokio = { workspace = true, features = ["test-util"] }
