// AegisTARA server API, version 1 (job 029, docs/adr/0026-server-skeleton.md).
//
// Rules the messages follow:
// - IDs are hyphenated lowercase UUID text.
// - An op travels as the bytes `OpCodec` produces: canonical JSON, the same
//   shape as the `op` member of an op log record. The server decodes it
//   with the capped, strict decoder of aegis-model (R3).
// - Every repeated field and every stream has a server-side bound (R4).
syntax = "proto3";

package aegis.v1;

service Aegis {
  // Server identity, engine version, and the methodologies it can host.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // Returns the methodology pack file (format aegis-methodology-pack v1).
  rpc GetMethodology(GetMethodologyRequest) returns (GetMethodologyResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // Streams the project snapshot (format aegis-project v1) in chunks. The
  // first chunk carries the header fields. `last_seq` is the sequence number
  // the snapshot is current as of; compare it with GetProjectStatus to learn
  // that a newer version exists.
  rpc OpenProject(OpenProjectRequest) returns (stream OpenProjectChunk);

  // Edit lease (decision D4): one editor per project at a time.
  rpc AcquireLock(LockRequest) returns (Lease);
  rpc RenewLock(RenewLockRequest) returns (Lease);
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse);
  // Admin only. Drops the current lease, whoever holds it.
  rpc BreakLock(LockRequest) returns (ReleaseLockResponse);

  // Validates and applies a batch of ops atomically: either every op is
  // accepted, or none is and the project is unchanged. Requires the lease.
  rpc SubmitOps(SubmitOpsRequest) returns (SubmitOpsResponse);

  // A cheap look at a project: its newest sequence number and who holds the
  // edit lock. Read-only clients ask now and then to learn that a newer
  // version exists (decision D23). Needs no lease.
  rpc GetProjectStatus(GetProjectStatusRequest) returns (ProjectStatus);

  // The official recomputed risks of every threat scenario.
  rpc GetRisks(GetRisksRequest) returns (GetRisksResponse);

  // Admin only. Recomputes the audit hash chain over the project's stored
  // op history and reports whether it is intact.
  rpc VerifyAudit(VerifyAuditRequest) returns (VerifyAuditResponse);

  // ---- the caller (job 037, docs/adr/0035-password-login.md) ----

  // Who the server thinks the caller is.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Ends the caller's password session. Other login methods: no effect.
  rpc LogOut(LogOutRequest) returns (LogOutResponse);
  // Changes the caller's own password (password login only). Ends every
  // other session of the caller.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // ---- users (admin only, password login only) ----

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (UserInfo);
  // Changes the fields that are set. Disabling a user or setting a new
  // password ends the user's sessions.
  rpc UpdateUser(UpdateUserRequest) returns (UserInfo);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // ---- login switch (job 045, docs/adr/0039-password-login-switch.md) ----

  // Any logged-in user may read the switch.
  rpc GetServerSettings(GetServerSettingsRequest) returns (ServerSettings);
  // Admin only. Turning password login off ends every password session at
  // once. Refused with `no_company_login` when the server has no company
  // login to fall back on.
  rpc SetPasswordLogin(SetPasswordLoginRequest) returns (ServerSettings);

  // ---- event log (job 049, docs/adr/0043-audit-and-license-views.md) ----

  // Admin only. The newest events of the server's event log (logins,
  // exports, admin actions), newest first. Answers `no_event_log` when the
  // server keeps none (development login, company login only).
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // ---- sessions (job 055, docs/adr/0049-session-admin.md) ----

  // Admin only, password login only. The open sessions, newest first, at
  // most 1000.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Admin only. Ends one session by the `id` of ListSessions. The owner's
  // next call is refused. Answers `unknown_session` if it has ended already.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // ---- baselines (job 039, docs/adr/0037-baselines-and-reports.md) ----

  // Freezes the project's current state under a name. Needs no lease.
  rpc CreateBaseline(CreateBaselineRequest) returns (BaselineInfo);
  rpc ListBaselines(ListBaselinesRequest) returns (ListBaselinesResponse);
  // Streams a baseline's snapshot (format aegis-project v1) in chunks, the
  // same way OpenProject does.
  rpc GetBaseline(GetBaselineRequest) returns (stream OpenProjectChunk);

  // ---- figures (job 073, ARC-01) ----

  // Uploads a PNG, JPEG or sanitized static SVG figure with a caption and
  // optional element target. Payload chunks are reassembled and checked
  // against per-file and per-project caps. Needs the edit lease.
  rpc PutFigure(PutFigureRequest) returns (FigureInfo);
  // Lists a project's attached figures, oldest first.
  rpc ListFigures(ListFiguresRequest) returns (ListFiguresResponse);
  // Streams a figure's bytes in chunks; the first chunk carries FigureInfo.
  rpc GetFigure(GetFigureRequest) returns (stream FigureChunk);
  // Updates a figure's caption or target element reference. Needs the edit lease.
  rpc UpdateFigure(UpdateFigureRequest) returns (FigureInfo);
  // Deletes a figure from the project. Needs the edit lease.
  rpc DeleteFigure(DeleteFigureRequest) returns (DeleteFigureResponse);

  // ---- project administration ----

  // Renames a project. Needs the edit lease, like any change.
  rpc RenameProject(RenameProjectRequest) returns (ProjectSummary);
  // Admin only. Deletes a project, its history and its baselines. Refused
  // while someone holds the edit lease.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // The latest accepted changes of a project, newest first (who, when,
  // what kind of change).
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  // Records that the caller exported a report, so exports are audited
  // (direction section 6).
  rpc RecordExport(RecordExportRequest) returns (RecordExportResponse);
}

// Login. Callable without credentials: a client learns how to log in from
// the server address alone, then logs in.
service Accounts {
  rpc GetLoginOptions(GetLoginOptionsRequest) returns (GetLoginOptionsResponse);
  // Checks a user name and password and opens a session. Every failure
  // gets the same answer, so a caller cannot tell a wrong name from a
  // wrong password. Repeated failures slow the account down.
  rpc LogIn(LogInRequest) returns (LogInResponse);
}

message GetLoginOptionsRequest {}

message GetLoginOptionsResponse {
  enum Method {
    METHOD_UNSPECIFIED = 0;
    // User name and password, checked by this server.
    PASSWORD = 1;
    // The company identity provider (OIDC with PKCE and DPoP).
    OIDC = 2;
    // Development only: the server trusts a user name header.
    DEVELOPMENT = 3;
  }
  Method method = 1;
  // Set for OIDC.
  string oidc_issuer = 2;
  string oidc_client_id = 3;
  string oidc_resource = 4;
  // Shown on the login screen, for example the company name.
  string server_name = 5;
  // True when a user name and password are also accepted. Always true for
  // PASSWORD, false for DEVELOPMENT, and for OIDC it follows the admin
  // setting (job 045). A client shows the company login first and offers
  // the password form only when this is set.
  bool password_enabled = 6;
}

message LogInRequest {
  string username = 1;
  string password = 2;
  // Free text naming the device, kept with the session for the admin.
  string client_name = 3;
}

message LogInResponse {
  // Send as `authorization: Bearer <session_token>`.
  string session_token = 1;
  uint64 expires_in_ms = 2;
  UserInfo user = 3;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string subject = 1;
  string display_name = 2;
  bool admin = 3;
  // How the caller logged in: "password", "oidc" or "development".
  string method = 4;
}

message LogOutRequest {}
message LogOutResponse {}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message UserInfo {
  string username = 1;
  string display_name = 2;
  bool admin = 3;
  bool disabled = 4;
  uint64 created_ms = 5;
  // 0 if the user never logged in.
  uint64 last_login_ms = 6;
  // Open sessions now.
  uint32 sessions = 7;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message CreateUserRequest {
  string username = 1;
  string display_name = 2;
  string password = 3;
  bool admin = 4;
}

message UpdateUserRequest {
  string username = 1;
  optional string display_name = 2;
  optional bool admin = 3;
  optional bool disabled = 4;
  // A new password set by the admin.
  optional string password = 5;
}

message DeleteUserRequest {
  string username = 1;
}

message DeleteUserResponse {}

message BaselineInfo {
  string baseline_id = 1;
  string project_id = 2;
  string name = 3;
  // The project state the baseline holds: ops 1..=seq.
  uint64 seq = 4;
  string created_by = 5;
  uint64 created_ms = 6;
  uint64 snapshot_bytes = 7;
}

message CreateBaselineRequest {
  string project_id = 1;
  string name = 2;
}

message ListBaselinesRequest {
  string project_id = 1;
}

message ListBaselinesResponse {
  repeated BaselineInfo baselines = 1;
}

message GetBaselineRequest {
  string project_id = 1;
  string baseline_id = 2;
}

message FigureInfo {
  string figure_id = 1;
  string project_id = 2;
  string caption = 3;
  // Empty for a project-level figure, or "<kind>:<uuid>" for an element.
  string target = 4;
  // "image/png", "image/jpeg" or "image/svg+xml".
  string media_type = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint64 byte_len = 8;
  bytes sha256 = 9;
  string created_by = 10;
  uint64 created_ms = 11;
}

message PutFigureRequest {
  string project_id = 1;
  string lock_token = 2;
  string caption = 3;
  string target = 4;
  string media_type = 5;
  repeated bytes chunks = 6;
}

message ListFiguresRequest {
  string project_id = 1;
}

message ListFiguresResponse {
  repeated FigureInfo figures = 1;
}

message GetFigureRequest {
  string project_id = 1;
  string figure_id = 2;
}

message FigureChunk {
  // Set on the first chunk only.
  FigureInfo info = 1;
  bytes data = 2;
}

message UpdateFigureRequest {
  string project_id = 1;
  string lock_token = 2;
  string figure_id = 3;
  string caption = 4;
  string target = 5;
}

message DeleteFigureRequest {
  string project_id = 1;
  string lock_token = 2;
  string figure_id = 3;
}

message DeleteFigureResponse {}

message RenameProjectRequest {
  string project_id = 1;
  string lock_token = 2;
  string name = 3;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

message ListHistoryRequest {
  string project_id = 1;
  // At most this many entries; the server caps it.
  uint32 limit = 2;
}

message HistoryEntry {
  uint64 seq = 1;
  string actor = 2;
  uint64 timestamp_ms = 3;
  // The op kind, for example "AddAsset".
  string kind = 4;
}

message ListHistoryResponse {
  repeated HistoryEntry entries = 1;
}

message RecordExportRequest {
  string project_id = 1;
  // For example "html-report" or "csv-risk-register".
  string kind = 2;
  // Optional machine-readable profile summary, for example
  // "profile=Submission lang=ja". Recorded in the export audit event (RPT-03).
  string detail = 3;
}

message RecordExportResponse {}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string server_version = 1;
  // Version of the aegis-model engine compiled into the server. A client
  // with a different engine version must show server results only.
  string engine_version = 2;
  repeated MethodologyInfo methodologies = 3;
  uint64 lease_ms = 4;
  // The server's license, as far as a user needs to know. Absent when the
  // server runs without license checking (development builds).
  LicenseInfo license = 5;
}

message LicenseInfo {
  enum State {
    STATE_UNSPECIFIED = 0;
    // In the paid period.
    ACTIVE = 1;
    // Past the paid period, inside the grace period. Everything works.
    GRACE = 2;
    // Over. Reading works; taking the edit lease is refused.
    EXPIRED = 3;
  }
  State state = 1;
  string customer = 2;
  uint32 seats = 3;
  // Named users holding a seat now.
  uint32 seats_used = 4;
  // Unix seconds.
  uint64 expires_at = 5;
  // Unix seconds. Equal to expires_at when there is no grace period.
  uint64 grace_ends_at = 6;
  repeated string features = 7;
}

message MethodologyInfo {
  string key = 1;
  string version = 2;
  string label = 3;
}

message GetMethodologyRequest {
  string key = 1;
}

message GetMethodologyResponse {
  string key = 1;
  string version = 2;
  bytes pack = 3;
}

message CreateProjectRequest {
  string name = 1;
  string methodology_key = 2;
}

message CreateProjectResponse {
  ProjectSummary project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
}

message ProjectSummary {
  string project_id = 1;
  string name = 2;
  string methodology_key = 3;
  string methodology_version = 4;
  uint64 created_ms = 5;
}

message OpenProjectRequest {
  string project_id = 1;
}

message OpenProjectChunk {
  // Set on the first chunk only.
  OpenProjectHeader header = 1;
  bytes data = 2;
}

message OpenProjectHeader {
  ProjectSummary project = 1;
  uint64 last_seq = 2;
  uint64 snapshot_bytes = 3;
  // Current lease holder, empty if the project is unlocked.
  string lock_holder = 4;
}

message LockRequest {
  string project_id = 1;
}

message RenewLockRequest {
  string project_id = 1;
  string token = 2;
}

message ReleaseLockRequest {
  string project_id = 1;
  string token = 2;
}

message ReleaseLockResponse {}

message Lease {
  string project_id = 1;
  string token = 2;
  string holder = 3;
  // Milliseconds until the lease expires. Renew well before this.
  uint64 expires_in_ms = 4;
  // The project's sequence number at the moment of the grant. A client whose
  // copy is older must reopen the project before it edits.
  uint64 last_seq = 5;
}

message SubmitOpsRequest {
  string project_id = 1;
  string lock_token = 2;
  // The sequence number the client built its ops on. Rejected with
  // FAILED_PRECONDITION if the project has moved on.
  uint64 base_seq = 3;
  repeated bytes ops = 4;
}

message SubmitOpsResponse {
  // Sequence number of the last accepted op. The client already holds the
  // inverse of every op it applied locally, so none is returned.
  uint64 last_seq = 1;
}

message GetProjectStatusRequest {
  string project_id = 1;
}

message ProjectStatus {
  // Sequence number of the last accepted op.
  uint64 last_seq = 1;
  // Current lease holder, empty if the project is unlocked.
  string lock_holder = 2;
}

message GetRisksRequest {
  string project_id = 1;
}

message GetRisksResponse {
  uint64 as_of_seq = 1;
  repeated ThreatRiskEntry threats = 2;
}

message ThreatRiskEntry {
  string threat_id = 1;
  // Risk level keys of the project's methodology; empty if not computable
  // (for example a threat with no damage scenario).
  string inherent_risk = 2;
  string residual_risk = 3;
}

message VerifyAuditRequest {
  string project_id = 1;
}

message VerifyAuditResponse {
  bool intact = 1;
  // Ops whose chain links checked out, counted from sequence 1.
  uint64 verified_ops = 2;
  // Sequence number of the first broken link, 0 if intact.
  uint64 first_bad_seq = 3;
  // Hash of the last verified op. Export it to a system the database admin
  // cannot write, to detect a full rewrite of the history.
  bytes head_hash = 4;
}

message GetServerSettingsRequest {}

message ServerSettings {
  // Password login is accepted now.
  bool password_login_enabled = 1;
  // The server has a company login (OIDC), so the switch may be turned off.
  bool company_login_available = 2;
}

message SetPasswordLoginRequest {
  bool enabled = 1;
}

message ListSessionsRequest {}

message SessionInfo {
  // 16 hex digits, stable while the session is open. Not the token.
  string id = 1;
  string username = 2;
  // The device name the app gave at login.
  string client_name = 3;
  uint64 created_ms = 4;
  uint64 expires_ms = 5;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message RevokeSessionRequest {
  string id = 1;
}

message RevokeSessionResponse {}

message ListEventsRequest {
  // 0 means the default (200). The server caps it at 1000.
  uint32 limit = 1;
}

message EventInfo {
  uint64 at_ms = 1;
  // Who did it, or the user name tried at a failed login.
  string actor = 2;
  // login_ok, login_failed, logout, password_changed, user_created,
  // user_updated, user_deleted, export, project_deleted, baseline_created,
  // password_login_changed, session_revoked.
  string kind = 3;
  string target = 4;
  string detail = 5;
}

message ListEventsResponse {
  repeated EventInfo events = 1;
}
