[package]
name = "aegis-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "AegisTARA client core: optimistic editing, undo, sync, and the view model. No UI toolkit."
license.workspace = true

[dependencies]
aegis-auth.workspace = true
aegis-license.workspace = true
aegis-canvas.workspace = true
aegis-model.workspace = true
aegis-proto.workspace = true
bytes.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tower = { workspace = true, features = ["timeout", "util"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
aegis-auth = { workspace = true, features = ["test-support"] }
aegis-server.workspace = true
aegis-license = { workspace = true, features = ["issuer"] }
proptest.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["test-util"] }
