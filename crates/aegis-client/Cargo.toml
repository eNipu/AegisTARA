[package]
name = "aegis-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "AegisTARA client core: optimistic editing, undo, sync, and the view model. No UI toolkit."
license.workspace = true

[dependencies]
aegis-auth.workspace = true
aegis-license.workspace = true
aegis-canvas.workspace = true
aegis-model.workspace = true
aegis-proto.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
krilla.workspace = true
skrifa.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyper-rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-web.workspace = true
tower = { workspace = true, features = ["timeout", "util"] }
# Find in page (UI-16): linear-time regular expressions, MIT or Apache-2.0 (D5).
regex = "1"

tracing.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
base64.workspace = true
flate2.workspace = true

[features]
# The OS keychain for remembered logins; the desktop apps turn it on.
os-keychain = ["aegis-auth/os-keychain"]

[dev-dependencies]
http-body-util.workspace = true
aegis-auth = { workspace = true, features = ["test-support"] }
aegis-server.workspace = true
aegis-license = { workspace = true, features = ["issuer"] }
proptest.workspace = true
uuid.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["test-util"] }
