# cargo-deny policy for AegisTARA production crates (decision D5, standard Q7).
# Pinned tool: cargo-deny 0.20.2 (`cargo install cargo-deny --version 0.20.2 --locked`).
# Rationale: docs/adr/0003-cargo-deny-policy.md
# Run all crates: scripts/deny.sh
#
# What this policy covers (D5, widened 2026-10-26, job 110): the dependency
# graph that ships. Development tools may have any license as long as nothing
# of them ships. cargo-deny leaves dev-dependencies out of the license check
# and scripts/deny.sh skips the license check for the non-shipped fuzz crate;
# tools/deny-fixtures/run.sh proves both, and proves that a copyleft crate
# which is also a normal dependency still fails.

[graph]
# Check optional dependencies too, so enabling a feature cannot pull in an
# unchecked license.
all-features = true

[licenses]
# Allow list only (D5). Anything not listed here fails, including licenses
# nobody has thought of yet. Do not add a deny list.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "OFL-1.1",
]
confidence-threshold = 0.93
# The allow list is the D5 policy, not a list of what we use today, so an
# entry no current dependency needs is expected and not worth a warning.
unused-allowed-license = "allow"
# Review-first licenses pass only through a per-crate exception that names the
# crate and version, with a comment pointing to the approving decision, e.g.
#   { crate = "name@1.2.3", allow = ["<SPDX-ID>"] },  # approved in D<N>
exceptions = [
    # The desktop shell's toolkit, Slint, under its Royalty-free License 2.0
    # (decision D7). The licence expression of every Slint crate is
    # "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
    # LicenseRef-Slint-Software-3.0"; the GPL option is not usable for a
    # proprietary product, so the royalty-free option is the one in force. It
    # requires an "About Slint" notice in the app and the Slint badge on the
    # download page (docs/release-checklist.md). Approval is a working
    # assumption pending the owner (decision D9): if D7 is rejected, delete
    # crates/aegis-shell and these eleven lines. One entry per crate and
    # version, so a Slint upgrade is reviewed, not inherited.
    { crate = "i-slint-backend-selector@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-skia@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-build@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros@1.18.1", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    # GPUI workbench (job 182): approved by the owner, see factory/jobs/182-workbench-skeleton/spec.md open question 1.
    # MPL-2.0 is file-level copyleft; the files ship unmodified and the
    # third-party notices name crates.io as their source. 0BSD is public-domain-like.
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "dwrote@0.11.5", allow = ["MPL-2.0"] },
    { crate = "cbindgen@0.28.0", allow = ["MPL-2.0"] },
    { crate = "enum-iterator@2.3.0", allow = ["0BSD"] },
    { crate = "enum-iterator-derive@1.5.0", allow = ["0BSD"] },
]

[licenses.private]
# Our own `publish = false` crates carry the repository's own license
# (PolyForm-Noncommercial-1.0.0, ADR 0076); skip them rather than putting any
# license ref on the allow list (ADR 0003).
ignore = true

[advisories]
yanked = "deny"
# A new advisory is fixed or explicitly reviewed, not silenced. Each entry
# names the advisory, the reason, and where it comes from.
#
# Reviewed 2026-10-25 (job 033). All four are "unmaintained" notices, not
# vulnerabilities, and all four enter only through the Slint desktop shell
# (winit window frame text, and the Linux accessibility bridge over D-Bus).
# No upgrade exists. They are ignored for the shell only in practice, because
# `[bans]` keeps Slint out of every other crate. Re-check at each Slint bump.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via slint > winit > sctk-adwaita (title bar font), no safe upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; via slint > accesskit_unix (Linux accessibility over D-Bus), no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; via slint > accesskit_unix, no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; via slint > accesskit_unix, no safe upgrade" },
    # Reviewed 2026-11-07: a notice, not a vulnerability; pin-utils is the
    # `pin_mut!` macro only. Slint 1.18.1 and spin_on 0.1.1 are the latest.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; via slint > spin_on (slint-macros, skia renderer), no safe upgrade" },
    # Reviewed 2026-11-18 (job 182): "unmaintained" notices, not
    # vulnerabilities, reached only through the GPUI workbench set, which
    # `[bans]` keeps in aegis-workbench. Re-check at each GPUI bump.
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; via gpui-component and gpui-base, no safe upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (proc macro); via gpui-component, no safe upgrade" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; via gpui-component > gpui-kit-assets > gpui-pre-reqwest, no safe upgrade" },
    # Reviewed 2026-11-28: a notice, not a vulnerability. Third-party only
    # (slint > i-slint-core, and gpui-pre and gpui-component); no crate of
    # ours depends on chrono. Re-check at each Slint or GPUI bump.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; via slint and gpui, no safe upgrade" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; via gpui-pre and gpui-component > resvg > usvg (SVG text), no safe upgrade" },
]

[bans]
# Warn, not deny: aegis-model already locks two versions of syn, getrandom and
# r-efi through upstream crates we do not control (uuid, proptest).
multiple-versions = "warn"
# Those duplicates come in through the proptest dev-dependency, which the
# duplicate check skips by default. Dev tools still enter our build machines,
# so include them and keep the duplicates visible.
multiple-versions-include-dev = true
wildcards = "deny"
# Non-shipped tooling only (D5): a crate with a tooling-only license exception
# may be a direct dependency of the named fuzz crates and nothing else, so a
# shipped crate cannot pick it up unnoticed.
deny = [
    { crate = "libfuzzer-sys", wrappers = ["aegis-model-fuzz"], reason = "fuzzing runtime (NCSA), non-shipped tooling only (D5)" },
    # Slint is confined to the desktop shell (D7, D9): the client core, the
    # server, and every other crate stay free of the UI toolkit.
    { crate = "slint", wrappers = ["aegis-shell"], reason = "UI toolkit, desktop shell only (D7)" },
    # GPUI is confined to the workbench (job 182, ADR 0066). gpui-pre's other
    # direct dependents are its own platform crates and gpui-component's
    # parts (`cargo tree -i gpui-pre -e normal --depth 1`).
    { crate = "gpui-component", wrappers = ["aegis-workbench"], reason = "UI toolkit, workbench only (D37)" },
    { crate = "gpui-pre-platform", wrappers = ["aegis-workbench"], reason = "UI toolkit platform layer, workbench only (D37)" },
    { crate = "gpui-pre", wrappers = [
        "aegis-workbench",
        "gpui-base",
        "gpui-component",
        "gpui-kit-assets",
        "gpui-pre-apple",
        "gpui-pre-ios",
        "gpui-pre-linux",
        "gpui-pre-macos",
        "gpui-pre-platform",
        "gpui-pre-web",
        "gpui-pre-wgpu",
        "gpui-pre-windows",
    ], reason = "UI toolkit, workbench only (D37)" },
]
# Path dependencies (fixtures, future workspace members) may omit a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
