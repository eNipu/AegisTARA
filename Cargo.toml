# Root of the Cargo workspace (job 027, docs/adr/0025-cargo-workspace.md).
#
# Every production crate lives under crates/ and is found by glob, the same
# rule scripts/ci.sh and scripts/deny.sh use. Spikes, deny fixtures, and the
# fuzz crate keep their own roots and are excluded.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "tools", "crates/aegis-model/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "LicenseRef-Proprietary"

# One version per dependency for the whole product (standards Q7). A crate
# opts in with `name.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
dhat = "0.3.3"
divan = "0.1.21"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router", "tls-ring", "tls-native-roots"] }
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
bytes = "1"
protox = "0.10"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
deadpool-postgres = "0.14"
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
krilla = { version = "0.8", default-features = false }
skrifa = "0.42"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "native-tokio", "tls12", "logging"] }
tokio-postgres-rustls = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
percent-encoding = "2"
keyring-core = "1"
windows-native-keyring-store = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aegis-model = { path = "crates/aegis-model" }
aegis-auth = { path = "crates/aegis-auth" }
aegis-proto = { path = "crates/aegis-proto" }
aegis-canvas = { path = "crates/aegis-canvas" }
aegis-client = { path = "crates/aegis-client" }
aegis-server = { path = "crates/aegis-server" }
aegis-shell = { path = "crates/aegis-shell" }
aegis-license = { path = "crates/aegis-license" }
png = "0.18"
rstar = "0.12"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "accessibility"] }
slint-build = "=1.18.1"
insta = "1"

# Shipped binaries (standards R10). Tests and benches use the dev profile.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Password hashing is deliberately slow; unoptimized it takes seconds per
# hash and makes the login tests crawl. Optimize just these crates in dev.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
