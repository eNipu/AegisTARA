# A TEST server on this machine, set up like the Railway test server
# (docs/railway.md): password login, no vendor license, PostgreSQL.
#
#   AEGIS_ADMIN_PASSWORD='choose a long one' \
#     docker compose -f deploy/compose.test.yaml up --build
#
# Then start the desktop app against http://127.0.0.1:50051 and log in as
# "admin". Never use this for real data: the license check is off.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-test
      POSTGRES_DB: aegis
    volumes:
      - aegis-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CARGO_FEATURES: dev-license
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "50051"
      AEGIS_AUTH: password
      AEGIS_ADMIN_USERNAME: admin
      AEGIS_ADMIN_PASSWORD: ${AEGIS_ADMIN_PASSWORD:?set AEGIS_ADMIN_PASSWORD}
      AEGIS_SERVER_NAME: AegisTARA test server
      AEGIS_DEV_LICENSE: "1"
      AEGIS_DATABASE_URL: postgresql://aegis:aegis-test@postgres/aegis
      RUST_LOG: info
    ports:
      - "127.0.0.1:50051:50051"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  aegis-test-db: {}
