[package]
name = "aegis-spike-freya"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
freya = { version = "=0.4.3", features = ["engine"] }
spike-model = { path = "../spike-model" }
freya-winit = "=0.4.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
