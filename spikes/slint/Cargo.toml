[package]
name = "aegis-spike-slint"
version = "0.1.0"
edition = "2024"
publish = false
description = "AegisTARA UI toolkit spike: customizable attack nodes with Slint"
build = "build.rs"

[dependencies]
spike-model = { path = "../spike-model" }
# Exact pin. Default features minus `system-tray`; `software-renderer-path` makes the
# software (CPU) renderer draw `Path` elements (the edges).
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-path",
    "accessibility",
] }

# Linux only: probe for the OpenGL libraries at startup (see `pick_renderer` in main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
