[package]
name = "aegis-spike-iced"
version = "0.1.0"
edition = "2024"
publish = false
description = "AegisTARA UI toolkit spike: customizable attack nodes with iced"

[dependencies]
spike-model = { path = "../spike-model" }
# Exact pins: every iced 0.x minor release breaks the API (0.15-dev on master rewrites overlays).
# default-features = false drops wayland, linux-theme-detection (dbus) and web-colors.
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "x11", "crisp", "thread-pool", "fira-sans", "sysinfo"] }
# Same versions iced already uses; only to measure text width for the badge pills on the canvas
# (iced::advanced would expose the same, but turning it on rebuilds every iced crate).
iced_core = "=0.14.0"
iced_graphics = "=0.14.0"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Only for the headless test harness: with no window manager, X input focus must be set by hand.
x11rb = "0.13"

# Same profile as the research probe, to reuse its warm build cache.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
